<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainHub | Aesthetic Training</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout-wrapper">
        
        <aside class="sidebar">
            <h2 class="logo">BrainHub</h2>
            <nav>
                <button class="nav-btn active" id="btn-reaction" onclick="switchGame('reaction')">Reaction Tester</button>
                <button class="nav-btn" id="btn-math" onclick="switchGame('math')">Mental Math ⚡</button>
                
                <div class="coming-soon">
                    <p>Coming Soon</p>
                    <button class="nav-btn disabled">Memory Matrix 🔒</button>
                    <button class="nav-btn disabled">Aim Trainer 🔒</button>
                </div>
            </nav>
        </aside>

        <div class="main-content">
            
            <div id="view-reaction" class="game-view active">
                <div class="app-container">
                    <header>
                        <h1>Reaction Tester</h1>
                        <p class="subtitle">Test your reflexes in a minimal space. Improve Your Focus</p>
                    </header>

                    <main>
                        <div class="dashboard">
                            <div class="stat-card">
                                <span class="label">Round</span>
                                <span class="value" id="round-display">0/5</span>
                            </div>
                            <div class="stat-card">
                                <span class="label">Average</span>
                                <span class="value" id="average-time">0.000s</span>
                            </div>
                            <div class="stat-card">
                                <span class="label">Best</span>
                                <span class="value" id="best-time">0.000s</span>
                            </div>
                        </div>

                        <div id="play-area" class="play-area">
                            <div id="target" class="target hidden"></div>
                            <div id="message-overlay" class="overlay">
                                <h2 id="main-message">Click to Start</h2>
                                <p id="sub-message">Wait for the target to appear.</p>
                            </div>
                        </div>
                    </main>
                </div>
            </div>

            <div id="view-math" class="game-view hidden">
                <div class="app-container">
                    <header>
                        <h1>Speed Math</h1>
                        <p class="subtitle">Calculate accurately before the time runs out.</p>
                    </header>

                    <main>
                        <div class="dashboard">
                            <div class="stat-card">
                                <span class="label">Score</span>
                                <span class="value" id="math-score">0</span>
                            </div>
                            <div class="stat-card">
                                <span class="label">Time Left</span>
                                <span class="value" id="math-timer">30s</span>
                            </div>
                        </div>

                        <div class="math-play-area">
                            <h2 id="math-question">Press Start to Begin</h2>
                            <input type="number" id="math-input" disabled onkeyup="checkAnswer(event)" placeholder="Type answer & press Enter">
                            <button id="start-math-btn" class="start-btn" onclick="startMathGame()">Start 30s Rush</button>
                        </div>
                    </main>
                </div>
            </div>

        </div>
    </div>
    
    <script src="script.js"></script>
    <script src="mathGame.js"></script> </body>
</html>
